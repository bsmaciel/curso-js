<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex004</title>
    <style>
        body {
            background-color: #d7cfc6;
            font-family: Arial, sans-serif;
            font: normal 20pt;
        }
    </style>        
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome?');
        document.write(`Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras!`);
        document.write(`<br>Seu nome em maiúsculas é ${nome.toUpperCase()}`);
        document.write(`<br>Seu nome em minúsculas é ${nome.toLowerCase()}`);
    </script>
</body>
</html>
