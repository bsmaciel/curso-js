<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Meu primeiro programa</title>
    <style>
      body {
        background-color: rgb(113, 167, 248);
        color: rgb(255, 255, 255);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px; /* comentário em CSS */
      }

      h1 {
        color: yellow;
      }
      p {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Olá, mundo!</h1>
    <p>Esta é a minha primeira página HTML usando JavaScript!</p>

    <script>
      // Comentários em JavaScript usam `//` e `/* */`
      var nome = window.prompt("Qual é o seu nome?");
      window.alert("Olá, " + nome + "! Seja bem-vindo ao JavaScript!"); //concatenando a variável nome com a string de saudação
    </script>
  </body>
</html>
