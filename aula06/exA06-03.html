<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Meu primeiro programa</title>
    <style>
      body {
        background-color: rgb(113, 167, 248);
        color: rgb(255, 255, 255);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px; /* comentário em CSS */
      }

      h1 {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <h1>Olá, mundo!</h1>
    <!-- comentário em HTML -->
    <p>Já me livrei da maldição.</p>

    <script>
      var nome = window.prompt("Qual é o seu nome?");
      document.write(
        `Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras!`
      );
      document.write(`<br>Seu nome em maiúsculas é ${nome.toUpperCase()}`);
      document.write(`<br>Seu nome em minúsculas é ${nome.toLowerCase()}`);
    </script>
  </body>
</html>
