						type="button"
						value="Adicionar"
						onclick="adicionar()" />

						<select name="flist" id="flist" size="6">

						</select>
					</p>
					<input
						type="button"
						value="Finalizar"
						onclick="finalizar()" />
				</form>
			</div>
			<div>
				<p id="label">Resultado:</p>
				<div id="resp"></div>
			</div>
		</section>
		<footer><p>&copy CursoemVideo</p></footer>
